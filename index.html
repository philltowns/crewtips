<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="CrewTips"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#c8102e"/>
  <meta name="description" content="Virgin Atlantic pilot knowledge base"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <title>CrewTips</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #c8102e; --red-dark: #a00c24; --red-light: #f9e5e8;
      --navy: #0a1628; --navy2: #16243e; --white: #ffffff;
      --surface: #f4f5f7; --card: #ffffff; --border: #e4e7ed;
      --text: #0f1923; --text2: #4a5568; --text3: #8a96a8;
      --radius: 12px; --radius-sm: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    html, body { height: 100%; font-family: var(--font); background: var(--surface); color: var(--text); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
    #app { display: flex; flex-direction: column; height: 100%; }
    .header-top, .search-wrap, .tabs, .sync-bar, .content { max-width: 680px; width: 100%; margin-left: auto; margin-right: auto; }
    .header { background: var(--red); padding: calc(var(--safe-top) + 14px) 16px 0; flex-shrink: 0; position: relative; overflow: hidden; }
    .header::after { content: ''; position: absolute; top: -40px; right: -40px; width: 160px; height: 160px; background: rgba(255,255,255,0.06); border-radius: 50%; pointer-events: none; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { width: 34px; height: 34px; background: rgba(255,255,255,0.18); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -0.5px; border: 1px solid rgba(255,255,255,0.25); flex-shrink: 0; }
    .brand-name { font-size: 19px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    .brand-sub { font-size: 11px; color: rgba(255,255,255,0.7); letter-spacing: 0.3px; margin-top: 1px; }
    .search-wrap { padding: 0 16px 14px; position: relative; }
    .search-inner { position: relative; }
    .search-inner input { width: 100%; padding: 10px 14px 10px 38px; border: none; border-radius: var(--radius-sm); font-size: 15px; font-family: var(--font); background: rgba(255,255,255,0.18); color: #fff; outline: none; }
    .search-inner input::placeholder { color: rgba(255,255,255,0.6); }
    .search-inner input:focus { background: rgba(255,255,255,0.25); }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.7); pointer-events: none; font-size: 16px; }
    .search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.25); border: none; color: #fff; width: 20px; height: 20px; border-radius: 50%; font-size: 13px; cursor: pointer; display: none; align-items: center; justify-content: center; font-family: var(--font); line-height: 1; }
    .search-clear.visible { display: flex; }
    .tabs { display: flex; border-top: 1px solid rgba(255,255,255,0.15); }
    .tab-btn { flex: 1; padding: 10px 4px; background: none; border: none; color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 500; font-family: var(--font); cursor: pointer; border-bottom: 3px solid transparent; transition: color 0.15s, border-color 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .tab-btn.active { color: #fff; border-bottom-color: #fff; }
    .sync-bar { font-size: 11px; font-weight: 500; text-align: center; padding: 4px; flex-shrink: 0; display: none; }
    .sync-bar.visible { display: block; }
    .sync-bar.ok { background: #e8f5e9; color: #2e7d32; }
    .sync-bar.offline { background: #fff3e0; color: #e65100; }
    .sync-bar.error { background: #fce4ec; color: #c62828; }
    .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 12px calc(var(--safe-bottom) + 16px); }
    .section-label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 8px; padding: 0 4px; }
    .faq-card { border-radius: var(--radius); margin-bottom: 8px; transition: opacity 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease; }
    .faq-card.dimmed { opacity: 0.3; }
    .faq-card.raised { box-shadow: 0 8px 20px rgba(0,0,0,0.15), 0 2px 6px rgba(0,0,0,0.08); transform: translateY(-1px); }
    .faq-card-inner { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    @keyframes faqOpenPulse {
      0% { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--red) 22%, transparent); }
      100% { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--red) 0%, transparent); }
    }
    .faq-card-flash { animation: faqOpenPulse 2s ease-out; }
    .faq-header { padding: 13px 14px; display: flex; align-items: flex-start; gap: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .faq-header:active { background: var(--surface); }
    .faq-q { flex: 1; font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.45; }
    .faq-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .faq-cat { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; white-space: nowrap; letter-spacing: 0.2px; }
    .faq-chevron { color: var(--text3); font-size: 14px; transition: transform 0.22s ease; line-height: 1; }
    .faq-chevron.open { transform: rotate(180deg); }
    .faq-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); font-size: 13.5px; line-height: 1.7; color: var(--text2); }
    .faq-body.open { display: block; }
    .faq-body p { margin-top: 10px; }
    .faq-body ol { margin: 8px 0 8px 18px; display: flex; flex-direction: column; gap: 4px; }
    .faq-body ul { margin: 8px 0 8px 18px; display: flex; flex-direction: column; gap: 4px; list-style: disc; }
    .faq-body strong { font-weight: 700; }
    .faq-body em { font-style: italic; }
    .faq-body u { text-decoration: underline; }
    .faq-body strong { color: var(--text); font-weight: 500; }
    .faq-path { display: inline-flex; align-items: center; gap: 6px; background: var(--red-light); border: none; border-radius: 20px; padding: 6px 12px 6px 8px; font-size: 12px; font-weight: 500; color: var(--red-dark); margin-top: 10px; line-height: 1.4; }
    .faq-path-icon { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; background: var(--red); border-radius: 50%; font-size: 9px; color: #fff; flex-shrink: 0; }
    .faq-links { margin-top: 12px; }
    .faq-links-label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 6px; }
    .faq-link { display: block; font-size: 13px; color: var(--red-dark); text-decoration: none; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .faq-link:last-child { border-bottom: none; }
    .faq-link:active { opacity: 0.7; }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--text3); }
    .empty-icon { font-size: 36px; margin-bottom: 10px; }
    .empty p { font-size: 14px; line-height: 1.6; }
    mark { background: #fff176; color: inherit; border-radius: 2px; padding: 0 1px; }
    .see-also-label { font-size: 10px; font-weight: 600; color: var(--red); letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 6px; }
    .see-also-inner { display: flex; align-items: center; gap: 10px; }
    .see-also-icon { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .see-also-text { flex: 1; }
    .see-also-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .see-also-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
    .see-also-arrow { font-size: 20px; color: var(--red); font-weight: 300; flex-shrink: 0; }
    .faq-img-block { margin: 10px 0; }
    .faq-img-reveal-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font); }
    .faq-img-reveal-btn:disabled { color: var(--text3); }
    .faq-img { display: block; max-width: 100%; border-radius: var(--radius-sm); margin-top: 2px; }
    .faq-img-hide-btn { display: block; background: none; border: none; color: var(--text3); font-size: 12px; font-weight: 500; padding: 6px 0 0; cursor: pointer; font-family: var(--font); }
    .faq-img-error { display: none; font-size: 12px; color: var(--red); margin-top: 6px; }
    .faq-img-error.show { display: block; }
    .faq-img-retry { background: none; border: none; color: var(--red-dark); font-size: 12px; font-weight: 600; text-decoration: underline; cursor: pointer; font-family: var(--font); padding: 0; margin-left: 4px; }
    .faq-imgset { margin: 10px 0; }
    .faq-imgset-items { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
    .faq-imgset-item { }
    .faq-img-caption { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }
    .faq-img-placeholder { height: 120px; border-radius: var(--radius-sm); background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 12px; }
    .faq-img-placeholder::after { content: 'Loading…'; }
    .pane { display: none; }
    .pane.active { display: block; }
    .tools-grid { display: flex; flex-direction: column; gap: 10px; }
    .tool-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; text-decoration: none; -webkit-tap-highlight-color: transparent; transition: background 0.15s; }
    .tool-card:active { background: var(--surface); }
    .tool-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--red-light); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .tool-body { flex: 1; }
    .tool-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
    .tool-desc { font-size: 13px; color: var(--text2); line-height: 1.4; }
    .tool-arrow { font-size: 22px; color: var(--text3); transition: transform 0.2s ease; }

    /* ---- See also (FAQ -> guides) ---- */
    .see-also-box { margin-top: 12px; border: 1.5px solid var(--red-light); border-radius: var(--radius-sm); padding: 10px 12px 4px; background: #fff9f9; }
    .see-also-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--red-light); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .see-also-label + .see-also-row { border-top: none; padding-top: 2px; }
    .see-also-row:active { opacity: 0.7; }
    .see-also-type { color: var(--red-dark); font-weight: 700; }

    /* ---- Guides tab ---- */
    .guide-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .guide-card:active { background: var(--surface); }
    .guide-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; align-self: flex-start; }
    .guide-card-body { flex: 1; min-width: 0; }
    .guide-card-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; line-height: 1.35; }
    .guide-card-text { font-size: 13px; color: var(--text2); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .guide-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
    .guide-chevron { font-size: 22px; color: var(--text3); flex-shrink: 0; }
    .type-badge, .guide-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; letter-spacing: 0.2px; }
    .type-badge.type-tip { background: #fff1cc; color: #7a4e00; }
    .type-badge.type-guide { background: #e4eaf4; color: #16243e; }
    .results-note { font-size: 12px; color: var(--text3); padding: 0 4px 8px; }

    /* ---- Rich text shared by FAQ answers and the guide reader ---- */
    .rt-heading { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.35; margin: 22px 0 4px; }
    .rt-heading:first-child { margin-top: 4px; }
    .inline-guide-link { display: inline; background: none; border: none; color: var(--red); font-size: inherit; font-family: var(--font); font-weight: 500; cursor: pointer; padding: 0; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; text-align: left; }
    .guide-gone { color: var(--text3); font-style: italic; }

    /* ---- Guide reader (own full-screen view) ---- */
    .reader { position: fixed; inset: 0; z-index: 100; background: var(--surface); display: none; flex-direction: column; }
    .reader.open { display: flex; }
    .reader-header { background: var(--red); flex-shrink: 0; padding: calc(var(--safe-top) + 10px) 0 10px; }
    .reader-header-inner { max-width: 680px; margin: 0 auto; padding: 0 12px; display: flex; align-items: center; gap: 12px; }
    .reader-back { background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 20px; padding: 6px 14px 6px 10px; font-size: 14px; font-weight: 600; font-family: var(--font); cursor: pointer; }
    .reader-back:active { background: rgba(255,255,255,0.3); }
    .reader-kind { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 500; }
    .reader-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .reader-inner { max-width: 680px; margin: 0 auto; padding: 18px 16px calc(var(--safe-bottom) + 32px); }
    .reader-title-row { display: flex; align-items: flex-start; gap: 12px; margin: 10px 0 14px; }
    .reader-title { font-size: 21px; font-weight: 700; line-height: 1.25; color: var(--text); letter-spacing: -0.2px; padding-top: 2px; }
    .reader-lead { font-size: 15px; line-height: 1.65; color: var(--text2); }
    .reader-lead.has-body { padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .reader-toc { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px 6px; margin-bottom: 16px; }
    .reader-toc-label { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 4px; }
    .reader-toc-item { display: block; width: 100%; text-align: left; background: none; border: none; border-top: 1px solid var(--border); padding: 9px 0; font-size: 14px; font-family: var(--font); color: var(--red-dark); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .reader-toc-label + .reader-toc-item { border-top: none; }
    .reader-toc-item:active { opacity: 0.7; }
    .reader-body, .reader-lead { font-size: 14.5px; line-height: 1.75; }
    .reader-lead { font-size: 15px; }
    .reader-body p, .reader-lead p { margin-top: 10px; }
    .reader-body p:first-child, .reader-lead p:first-child { margin-top: 0; }
    .reader-body ol, .reader-lead ol { margin: 8px 0 8px 20px; display: flex; flex-direction: column; gap: 4px; }
    .reader-body ul, .reader-lead ul { margin: 8px 0 8px 20px; display: flex; flex-direction: column; gap: 4px; list-style: disc; }
    .reader-body strong, .reader-lead strong { font-weight: 700; color: var(--text); }
    .reader-body em, .reader-lead em { font-style: italic; }
    .reader-body u, .reader-lead u { text-decoration: underline; }
  </style>
</head>
<body>
<div id="app">
  <header class="header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-mark">CT</div>
        <div>
          <div class="brand-name">CrewTips</div>
          <div class="brand-sub">Pilot knowledge base</div>
        </div>
      </div>
    </div>
    <div class="search-wrap" id="searchWrap">
      <div class="search-inner">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInput" placeholder="Search FAQs, keywords…" oninput="onSearch()" autocomplete="off" autocorrect="off" spellcheck="false"/>
        <button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-faqs" onclick="switchTab('faqs')">FAQs</button>
      <button class="tab-btn" id="tab-guides" onclick="switchTab('guides')">Guides</button>
      <button class="tab-btn" id="tab-tools" onclick="switchTab('tools')">🛠 Tools</button>
    </div>
  </header>
  <div class="sync-bar" id="syncBar"></div>
  <div class="content">
    <div class="pane active" id="pane-faqs"></div>
    <div class="pane" id="pane-guides"></div>
    <div class="pane" id="pane-tools">
      <div class="section-label">Calculators &amp; tools</div>
      <div class="tools-grid">
        <a href="calculator.html" class="tool-card">
          <div class="tool-icon">😴</div>
          <div class="tool-body">
            <div class="tool-name">Crew Rest Calculator</div>
            <div class="tool-desc">Plan crew rest periods for 3 or 4-pilot operations</div>
          </div>
          <div class="tool-arrow">›</div>
        </a>
        <a href="links.html" class="tool-card" id="quickLinksCard" style="display:none">
          <div class="tool-icon">🔗</div>
          <div class="tool-body">
            <div class="tool-name">Quick Links</div>
            <div class="tool-desc">Useful links and resources</div>
          </div>
          <div class="tool-arrow">›</div>
        </a>
      </div>
    </div>
  </div>
</div>

<div class="reader" id="reader" aria-hidden="true">
  <div class="reader-header">
    <div class="reader-header-inner">
      <button class="reader-back" onclick="history.back()">‹ Back</button>
      <div class="reader-kind" id="readerKind"></div>
    </div>
  </div>
  <div class="reader-scroll" id="readerScroll"><div class="reader-inner" id="readerInner"></div></div>
</div>

<script>
// ─────────────────────────────────────────────
// DROPBOX CONFIG
// ─────────────────────────────────────────────
const DBX_PUBLIC_URL = 'https://dl.dropboxusercontent.com/scl/fi/98o30nncoebz9epc8toes/data.json?rlkey=bvau0tss2fnxg271dk5oicegu&st=mlu2ob3t';

// ─────────────────────────────────────────────
// APP STATE
// ─────────────────────────────────────────────
const STORAGE_KEY  = 'crewtips_data';
const DBX_CACHE_KEY  = 'crewtips_dbx_cache';

let appData      = null;
let currentTab   = 'faqs';
let searchTerm   = '';

// Guide types. The label shown to pilots (FAQ links, badges, reader header)
// comes from here only, so renaming "Top Tip" later is a one-line change.
const GUIDE_TYPES = {
  tip:   { label: 'Top Tip', icon: '💡' },
  guide: { label: 'Guide',   icon: '📘' }
};

// Dim other FAQs + raise/shadow the open one while it's expanded.
// Set to false to switch this off entirely without touching any other code.
const FAQ_FOCUS_MODE = true;

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
async function init() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  loadCached();
  render();
  await fetchLatest();
}

function loadCached() {
  try {
    const dbxCache = localStorage.getItem(DBX_CACHE_KEY);
    if (dbxCache) { appData = JSON.parse(dbxCache); return; }
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { appData = JSON.parse(raw); return; }
  } catch(e) {}
  appData = getDefaultData();
}

async function fetchLatest() {
  // Always try public Dropbox URL first — works for all users including pilots
  try {
    const res = await fetch(DBX_PUBLIC_URL + '&v=' + Date.now());
    if (res.ok) {
      const json = await res.json();
      if (json && json.faqs) {
        appData = json;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        localStorage.setItem(DBX_CACHE_KEY, JSON.stringify(appData));
        render();
        showSyncBar('Content updated ✓', 'ok');
        return;
      }
    }
  } catch(e) {
    console.warn('Public Dropbox fetch failed:', e);
  }

  // Fall back to cached data or static seed
  try {
    const res = await fetch('./data.json?v=' + Date.now());
    if (!res.ok) throw new Error('not ok');
    const json = await res.json();
    if (json && json.faqs) {
      appData = json;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      render();
      showSyncBar('Content updated ✓', 'ok');
    }
  } catch(e) {
    showSyncBar('Offline — showing cached content', 'offline');
  }
}

// ─────────────────────────────────────────────
// SYNC BAR
// ─────────────────────────────────────────────
function showSyncBar(msg, type) {
  const bar = document.getElementById('syncBar');
  bar.textContent = msg;
  bar.className = 'sync-bar visible ' + (type || 'ok');
  setTimeout(() => { bar.className = 'sync-bar'; }, 3000);
}

// ─────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────
function onSearch() {
  searchTerm = document.getElementById('searchInput').value.trim();
  document.getElementById('searchClear').classList.toggle('visible', searchTerm.length > 0);
  render();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  searchTerm = '';
  document.getElementById('searchClear').classList.remove('visible');
  render();
}

function hl(text, term) {
  if (!term) return escHtml(text);
  const safe = escHtml(text);
  return safe.replace(new RegExp('(' + escRe(term) + ')', 'gi'), '<mark>$1</mark>');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function catName(key) { return (appData.categories && appData.categories[key]) || key; }

function matchFaq(f, t) {
  const tl = t.toLowerCase();
  return f.q.toLowerCase().includes(tl) || f.a.toLowerCase().includes(tl)
    || (f.path||'').toLowerCase().includes(tl) || catName(f.cat).toLowerCase().includes(tl)
    || (f.keywords||'').toLowerCase().includes(tl);
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function render() { renderFaqs(); renderGuides(); renderQuickLinks(); }

// Quick Links now live on their own page (links.html), same pattern as
// the Crew Rest Calculator — this just shows/hides the entry card in the
// Tools tab depending on whether any links exist.
function renderQuickLinks() {
  const card = document.getElementById('quickLinksCard');
  if (!card) return;
  const links = (appData && appData.quickLinks) || [];
  card.style.display = links.length ? '' : 'none';
}

function categoryColorInfo(cat) {
  const known = {
    fusion:  { bg: '#e6f1fb', text: '#185FA5' },
    roster:  { bg: '#eaf3de', text: '#3B6D11' },
    pay:     { bg: '#faeeda', text: '#854F0B' },
    medical: { bg: '#FAECE7', text: '#993C1D' },
    it:      { bg: '#eeedfe', text: '#3C3489' },
    general: { bg: '#f0ede5', text: '#5F5E5A' }
  };
  if (known[cat]) return known[cat];
  // Custom category — deterministic hash to a hue so it gets a consistent,
  // distinct colour every time rather than falling back to plain/grey
  let hash = 0;
  for (let i = 0; i < cat.length; i++) hash = (hash * 31 + cat.charCodeAt(i)) >>> 0;
  const hue = hash % 360;
  return { bg: 'hsl(' + hue + ',65%,92%)', text: 'hsl(' + hue + ',55%,32%)' };
}
function catIconBg(cat) { return categoryColorInfo(cat).bg; }

function renderFaqs() {
  const list = searchTerm ? appData.faqs.filter(f => matchFaq(f, searchTerm)) : appData.faqs;
  const pane = document.getElementById('pane-faqs');
  if (!list.length) {
    pane.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><p>No FAQs match <strong>"' + escHtml(searchTerm) + '"</strong></p></div>';
    return;
  }
  pane.innerHTML = '<div class="section-label">Questions &amp; answers</div>' + list.map(f => faqCard(f)).join('');
}

// Builds the HTML for one line of rich text.
//
// Tags are lifted out into placeholders BEFORE search highlighting runs,
// then put back afterwards. Without this, searching for a letter that
// appears inside a tag (e.g. "b", "h", or "guide") would wrap that letter
// in <mark> and break the tag. Placeholders use private-use characters
// that can never appear in something a pilot types into the search box.
function guideGone() { return '<span class="guide-gone">(guide no longer available)</span>'; }

function guideLinkHtml(id) {
  const g = findGuide(id);
  if (!g) return guideGone();
  return '<button class="inline-guide-link" onclick="openGuide(\'' + escHtml(String(g.id)) + '\')">' + escHtml(g.title) + ' →</button>';
}

function richLine(raw) {
  const tokens = [];
  const hold = html => { tokens.push(html); return '\uE000' + String.fromCharCode(0xE100 + tokens.length - 1) + '\uE001'; };

  let s = raw.replace(/\[guide:([^\]]+)\]/g, (m, id) => hold(guideLinkHtml(id.trim())));
  [['b', 'strong'], ['i', 'em'], ['u', 'u']].forEach(([tag, el]) => {
    const re = new RegExp('\\[' + tag + '\\](.+?)\\[\\/' + tag + '\\]', 'g');
    s = s.replace(re, (m, inner) => hold('<' + el + '>') + inner + hold('</' + el + '>'));
  });

  let html = hl(s, searchTerm);
  return html.replace(/\uE000([\uE100-\uF8FF])\uE001/g, (m, ch) => tokens[ch.charCodeAt(0) - 0xE100]);
}

// Shared rich-text engine — used for FAQ answers and for guide/tip bodies,
// so both get the same formatting/bullets/images/guide-links/headings.
// Pass { headings: [] } to collect the [h]...[/h] headings (for a contents list).
let headingSeq = 0;
function renderRichText(text, opts) {
  let html = ''; let listType = null;
  let currentSet = null; // { title, items: [{url, title}] } while inside [imgset:...]...[/imgset]
  const closeList = () => { if (listType) { html += (listType === 'ol' ? '</ol>' : '</ul>'); listType = null; } };
  const renderImageBlock = (url, title) => {
    const label = title ? escHtml(title) + ' — view image' : 'View image';
    return '<div class="faq-img-block" data-img-url="' + escHtml(url) + '">'
      + '<button class="faq-img-reveal-btn" data-label="📷 ' + label + '" onclick="revealImage(this)">📷 ' + label + '</button>'
      + '<div class="faq-img-error"></div></div>';
  };

  text.split('\n').forEach(line => {
    const trimmed = line.trim();

    if (trimmed === '[/imgset]') {
      if (currentSet) {
        const count = currentSet.items.length;
        const label = (currentSet.title ? escHtml(currentSet.title) + ' — ' : '') + 'view images (' + count + ')';
        html += '<div class="faq-imgset">'
          + '<button class="faq-img-reveal-btn" data-label="📷 ' + label + '" onclick="revealImageSet(this)">📷 ' + label + '</button>'
          + '<div class="faq-imgset-items" style="display:none">'
          + currentSet.items.map(item => {
              const cap = item.title ? '<div class="faq-img-caption">' + escHtml(item.title) + '</div>' : '';
              return '<div class="faq-imgset-item" data-img-url="' + escHtml(item.url) + '">' + cap
                + '<div class="faq-img-placeholder"></div><div class="faq-img-error"></div></div>';
            }).join('')
          + '</div></div>';
      }
      currentSet = null;
      return;
    }
    const setOpenMatch = trimmed.match(/^\[imgset:(.*)\]$/);
    if (setOpenMatch) {
      closeList();
      currentSet = { title: setOpenMatch[1].trim(), items: [] };
      return;
    }

    const imgMatch = trimmed.match(/^\[img:([^|\]]+)(?:\|([^\]]+))?\]$/);
    if (imgMatch) {
      if (currentSet) { currentSet.items.push({ url: imgMatch[1].trim(), title: imgMatch[2] ? imgMatch[2].trim() : '' }); return; }
      closeList();
      html += renderImageBlock(imgMatch[1].trim(), imgMatch[2] ? imgMatch[2].trim() : '');
      return;
    }

    if (currentSet) return; // ignore stray non-image lines inside a set

    const headingMatch = trimmed.match(/^\[h\](.+)\[\/h\]$/);
    if (headingMatch) {
      closeList();
      const hid = 'rt-h-' + (++headingSeq);
      if (opts && opts.headings) opts.headings.push({ id: hid, text: headingMatch[1].replace(/\[\/?[biu]\]/g, '').trim() });
      html += '<h3 class="rt-heading" id="' + hid + '">' + richLine(headingMatch[1]) + '</h3>';
      return;
    }

    const numMatch = line.match(/^(\d+)\.\s+(.+)/);
    const bulletMatch = line.match(/^-\s+(.+)/);
    if (numMatch) {
      if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
      html += '<li>' + richLine(numMatch[2]) + '</li>';
    } else if (bulletMatch) {
      if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
      html += '<li>' + richLine(bulletMatch[1]) + '</li>';
    } else {
      closeList();
      if (line.trim()) html += '<p>' + richLine(line) + '</p>';
    }
  });
  closeList();
  return html;
}

function faqCard(f) {
  const answerHtml = renderRichText(f.a);
  const pathHtml = f.path ? '<div class="faq-path"><span class="faq-path-icon">📍</span>' + escHtml(f.path) + '</div>' : '';
  let linksHtml = '';
  if (f.links && f.links.length) {
    linksHtml = '<div class="faq-links"><div class="faq-links-label">🔗 Related links</div>'
      + f.links.map(l => '<a class="faq-link" href="' + escHtml(l.url) + '" target="_blank" rel="noopener">' + escHtml(l.label) + '</a>').join('')
      + '</div>';
  }
  let seeAlsoHtml = '';
  const related = (Array.isArray(f.seeAlso) ? f.seeAlso : []).map(findGuide).filter(Boolean);
  if (related.length) {
    seeAlsoHtml = '<div class="see-also-box"><div class="see-also-label">See also</div>'
      + related.map(g => {
        const info = guideTypeInfo(g);
        return '<div class="see-also-row" onclick="openGuide(\'' + escHtml(String(g.id)) + '\')">'
          + '<div class="see-also-icon" style="background:' + catIconBg(g.cat) + '">' + escHtml(g.icon || info.icon) + '</div>'
          + '<div class="see-also-text"><div class="see-also-title"><span class="see-also-type">' + escHtml(info.label) + ':</span> ' + escHtml(g.title) + '</div>'
          + '<div class="see-also-sub">' + escHtml(catName(g.cat)) + '</div></div>'
          + '<div class="see-also-arrow">›</div></div>';
      }).join('')
      + '</div>';
  }
  const catColor = categoryColorInfo(f.cat);
  return '<div class="faq-card" id="faqc-' + f.id + '"><div class="faq-card-inner"><div class="faq-header" onclick="toggleFaq(' + f.id + ')" id="faqh-' + f.id + '">'
    + '<span class="faq-q">' + hl(f.q, searchTerm) + '</span>'
    + '<div class="faq-right"><span class="faq-cat" style="background:' + catColor.bg + ';color:' + catColor.text + '">' + escHtml(catName(f.cat)) + '</span>'
    + '<span class="faq-chevron" id="chev-' + f.id + '">▾</span></div></div>'
    + '<div class="faq-body" id="body-' + f.id + '">' + answerHtml + pathHtml + linksHtml + seeAlsoHtml + '</div></div></div>';
}

function toggleFaq(id) {
  const body = document.getElementById('body-' + id);
  const chev = document.getElementById('chev-' + id);
  const card = document.getElementById('faqc-' + id);
  const isOpen = body.classList.contains('open');
  document.querySelectorAll('.faq-body.open').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.faq-chevron.open').forEach(c => c.classList.remove('open'));

  if (isOpen) {
    // Closing this FAQ — nothing left open, so clear any focus styling
    if (FAQ_FOCUS_MODE) {
      document.querySelectorAll('.faq-card').forEach(c => { c.classList.remove('dimmed'); c.classList.remove('raised'); });
    }
    return;
  }

  body.classList.add('open');
  chev.classList.add('open');

  // Dim every other FAQ and raise this one, for as long as it stays open —
  // set FAQ_FOCUS_MODE = false above to switch this off entirely.
  if (FAQ_FOCUS_MODE && card) {
    document.querySelectorAll('.faq-card').forEach(c => {
      if (c === card) { c.classList.remove('dimmed'); c.classList.add('raised'); }
      else { c.classList.add('dimmed'); c.classList.remove('raised'); }
    });
  }

  if (card) {
    // Snap the top of the card to the top of the scrollable content area —
    // smooth, not pinned, so the pilot can still scroll freely afterward.
    // Near the end of the list there may not be enough content below to
    // reach the top; the browser scrolls as far as it can and stops there.
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  const inner = card ? card.querySelector('.faq-card-inner') : null;
  if (inner) {
    // Brief low-opacity glow to acknowledge the FAQ has opened — colour is
    // derived from --red via color-mix() so it stays in sync automatically
    // if the brand colour is ever changed. Single pulse, open only.
    inner.classList.remove('faq-card-flash');
    void inner.offsetWidth; // force reflow so the animation retriggers on repeat opens
    inner.classList.add('faq-card-flash');
  }
}

// Nothing downloads until this is tapped — the actual fetch is what the
// service worker intercepts and caches (image URLs are cache-first, see
// sw.js), so a second tap anywhere/anytime after the first successful
// load works instantly and fully offline.
async function revealImage(btn) {
  const container = btn.closest('.faq-img-block');
  const existingImg = container.querySelector('.faq-img');
  if (existingImg) {
    // Already fetched once this session — just show it again, no re-fetch
    existingImg.style.display = '';
    const hideLink = container.querySelector('.faq-img-hide-btn');
    if (hideLink) hideLink.style.display = '';
    btn.style.display = 'none';
    return;
  }
  const url = container.dataset.imgUrl;
  const errEl = container.querySelector('.faq-img-error');
  errEl.textContent = ''; errEl.classList.remove('show');
  const originalLabel = btn.dataset.label || '📷 View image';
  btn.disabled = true;
  btn.textContent = 'Loading…';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    const objectUrl = URL.createObjectURL(blob);
    const img = document.createElement('img');
    img.src = objectUrl;
    img.className = 'faq-img';
    const hideLink = document.createElement('button');
    hideLink.className = 'faq-img-hide-btn';
    hideLink.textContent = '▲ Hide image';
    hideLink.onclick = () => hideImage(container);
    btn.style.display = 'none';
    container.appendChild(img);
    container.appendChild(hideLink);
  } catch(e) {
    btn.disabled = false;
    btn.textContent = originalLabel;
    errEl.textContent = "Couldn't load image — check your connection and try again.";
    errEl.classList.add('show');
  }
}

function hideImage(container) {
  const btn = container.querySelector('.faq-img-reveal-btn');
  const img = container.querySelector('.faq-img');
  const hideLink = container.querySelector('.faq-img-hide-btn');
  // Just hide, don't destroy — keeps the already-downloaded image ready
  // for an instant re-reveal rather than fetching it all over again
  if (img) img.style.display = 'none';
  if (hideLink) hideLink.style.display = 'none';
  if (btn) { btn.style.display = ''; btn.disabled = false; btn.textContent = btn.dataset.label || '📷 View image'; }
}

// Reveals every image in a set together on one tap. Each image is still
// fetched/cached individually — if one fails (patchy signal mid-download)
// the others still show normally, with just that one item getting an
// inline retry rather than failing the whole set.
async function revealImageSet(btn) {
  const container = btn.closest('.faq-imgset');
  const itemsEl = container.querySelector('.faq-imgset-items');
  btn.style.display = 'none';
  itemsEl.style.display = 'flex';
  const itemEls = itemsEl.querySelectorAll('.faq-imgset-item');
  await Promise.all(Array.from(itemEls).map(el => revealSetItem(el)));
  const existingHideLink = container.querySelector('.faq-img-hide-btn');
  if (existingHideLink) {
    existingHideLink.style.display = '';
  } else {
    const hideLink = document.createElement('button');
    hideLink.className = 'faq-img-hide-btn';
    hideLink.textContent = '▲ Hide images';
    hideLink.onclick = () => hideImageSet(container);
    container.appendChild(hideLink);
  }
}

function hideImageSet(container) {
  const btn = container.querySelector('.faq-img-reveal-btn');
  const itemsEl = container.querySelector('.faq-imgset-items');
  const hideLink = container.querySelector('.faq-img-hide-btn');
  // Just hide, don't destroy — the images already downloaded stay ready
  // for an instant re-reveal (revealSetItem skips anything already loaded)
  itemsEl.style.display = 'none';
  if (hideLink) hideLink.style.display = 'none';
  if (btn) { btn.style.display = ''; btn.disabled = false; btn.textContent = btn.dataset.label || '📷 View images'; }
}

async function revealSetItem(el) {
  const url = el.dataset.imgUrl;
  const placeholder = el.querySelector('.faq-img-placeholder');
  const errEl = el.querySelector('.faq-img-error');
  if (!placeholder) return; // already revealed (e.g. a retry)
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    const objectUrl = URL.createObjectURL(blob);
    const img = document.createElement('img');
    img.src = objectUrl;
    img.className = 'faq-img';
    placeholder.replaceWith(img);
  } catch(e) {
    placeholder.remove();
    errEl.innerHTML = "Couldn't load this image. <button class=\"faq-img-retry\" onclick=\"retrySetItem(this)\">Retry</button>";
    errEl.classList.add('show');
  }
}

function retrySetItem(retryBtn) {
  const el = retryBtn.closest('.faq-imgset-item');
  const errEl = el.querySelector('.faq-img-error');
  errEl.textContent = ''; errEl.classList.remove('show');
  const placeholder = document.createElement('div');
  placeholder.className = 'faq-img-placeholder';
  el.insertBefore(placeholder, errEl);
  revealSetItem(el);
}

// ─────────────────────────────────────────────
// GUIDES (Top Tips + Guides)
// ─────────────────────────────────────────────
function guidesList() { return (appData && Array.isArray(appData.guides)) ? appData.guides : []; }
function findGuide(id) { return guidesList().find(g => String(g.id) === String(id)); }
function guideTypeInfo(g) { return GUIDE_TYPES[g.type === 'tip' ? 'tip' : 'guide']; }

// Strips rich-text tags so a teaser can be shown as plain text in a list row.
function plainText(s) {
  return String(s || '')
    .replace(/\[guide:[^\]]*\]/g, '')
    .replace(/\[\/?[biuh]\]/g, '')
    .replace(/\s*\n+\s*/g, ' ')
    .trim();
}

function matchGuide(g, t) {
  const tl = t.toLowerCase();
  if ((g.title || '').toLowerCase().includes(tl)) return 3;
  if ((g.text || '').toLowerCase().includes(tl)) return 2;
  if ((g.body || '').toLowerCase().includes(tl)
      || catName(g.cat).toLowerCase().includes(tl)
      || guideTypeInfo(g).label.toLowerCase().includes(tl)) return 1;
  return 0;
}

function guideCard(g) {
  const info = guideTypeInfo(g);
  const cc = categoryColorInfo(g.cat);
  return '<div class="guide-card" onclick="openGuide(\'' + escHtml(String(g.id)) + '\')">'
    + '<div class="guide-icon" style="background:' + cc.bg + '">' + escHtml(g.icon || info.icon) + '</div>'
    + '<div class="guide-card-body"><div class="guide-card-title">' + hl(g.title, searchTerm) + '</div>'
    + '<div class="guide-card-text">' + hl(plainText(g.text), searchTerm) + '</div>'
    + '<div class="guide-badges"><span class="type-badge type-' + (g.type === 'tip' ? 'tip' : 'guide') + '">' + escHtml(info.label) + '</span>'
    + '<span class="guide-badge" style="background:' + cc.bg + ';color:' + cc.text + '">' + escHtml(catName(g.cat)) + '</span></div></div>'
    + '<div class="guide-chevron">›</div></div>';
}

function renderGuides() {
  const pane = document.getElementById('pane-guides');
  const all = guidesList();
  if (!all.length) { pane.innerHTML = '<div class="empty"><div class="empty-icon">📘</div><p>No guides yet.</p></div>'; return; }

  if (searchTerm) {
    // One mixed list while searching, best matches first (title, then teaser, then the rest)
    const hits = all.map((g, i) => ({ g, i, score: matchGuide(g, searchTerm) }))
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score || a.i - b.i);
    if (!hits.length) {
      pane.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><p>No guides match <strong>"' + escHtml(searchTerm) + '"</strong></p></div>';
      return;
    }
    pane.innerHTML = '<div class="section-label">Search results</div>' + hits.map(x => guideCard(x.g)).join('');
    return;
  }

  const tips = all.filter(g => g.type === 'tip');
  const guides = all.filter(g => g.type !== 'tip');
  pane.innerHTML = (tips.length ? '<div class="section-label">Top tips</div>' + tips.map(guideCard).join('') : '')
    + (guides.length ? '<div class="section-label"' + (tips.length ? ' style="margin-top:14px"' : '') + '>Guides</div>' + guides.map(guideCard).join('') : '');
}

// ─────────────────────────────────────────────
// GUIDE READER
// ─────────────────────────────────────────────
// Each opened guide is one history entry. readerStack mirrors those entries
// so the back button (or the Back control, which just calls history.back())
// returns to the previous guide at the scroll position it was left at, and
// finally to whatever was underneath — the Guides list or an open FAQ, which
// stay exactly as they were because the reader is an overlay.
let readerStack = [];   // [{ id, scroll }]
let lastGuideOpen = 0;

function openGuide(id) {
  const g = findGuide(id);
  if (!g) return;
  const now = Date.now();
  const top = readerStack[readerStack.length - 1];
  if (top && String(top.id) === String(g.id) && now - lastGuideOpen < 500) return; // double-tap guard
  lastGuideOpen = now;
  if (top) top.scroll = document.getElementById('readerScroll').scrollTop;
  readerStack.push({ id: String(g.id), scroll: 0 });
  history.pushState({ crewtipsReader: true }, '');
  showReader(g, 0);
}

function showReader(g, scrollTo) {
  const info = guideTypeInfo(g);
  const headings = [];
  const hasBody = !!(g.body && g.body.trim());
  const bodyHtml = hasBody ? renderRichText(g.body, { headings }) : '';
  const leadHtml = renderRichText(g.text || '');
  const cc = categoryColorInfo(g.cat);

  const toc = (g.showContents && headings.length)
    ? '<nav class="reader-toc"><div class="reader-toc-label">Contents</div>'
      + headings.map(h => '<button class="reader-toc-item" onclick="jumpToHeading(\'' + h.id + '\')">' + escHtml(h.text) + '</button>').join('')
      + '</nav>'
    : '';

  document.getElementById('readerKind').textContent = info.label;
  document.getElementById('readerInner').innerHTML =
    '<div class="guide-badges"><span class="type-badge type-' + (g.type === 'tip' ? 'tip' : 'guide') + '">' + escHtml(info.label) + '</span>'
    + '<span class="guide-badge" style="background:' + cc.bg + ';color:' + cc.text + '">' + escHtml(catName(g.cat)) + '</span></div>'
    + '<div class="reader-title-row"><div class="guide-icon" style="background:' + cc.bg + '">' + escHtml(g.icon || info.icon) + '</div>'
    + '<h1 class="reader-title">' + escHtml(g.title) + '</h1></div>'
    + '<div class="reader-lead' + (hasBody ? ' has-body' : '') + '">' + leadHtml + '</div>'
    + toc
    + (hasBody ? '<div class="reader-body">' + bodyHtml + '</div>' : '');

  const reader = document.getElementById('reader');
  reader.classList.add('open');
  reader.setAttribute('aria-hidden', 'false');
  document.getElementById('readerScroll').scrollTop = scrollTo || 0;
}

function hideReader() {
  const reader = document.getElementById('reader');
  reader.classList.remove('open');
  reader.setAttribute('aria-hidden', 'true');
  document.getElementById('readerInner').innerHTML = '';
}

function jumpToHeading(hid) {
  const el = document.getElementById(hid);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

window.addEventListener('popstate', () => {
  if (!readerStack.length) return; // nothing open — let the back press behave normally
  readerStack.pop();
  const prev = readerStack[readerStack.length - 1];
  const g = prev ? findGuide(prev.id) : null;
  if (g) showReader(g, prev.scroll);
  else { readerStack = []; hideReader(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && readerStack.length) history.back();
});

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === 'tab-' + tab));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + tab));
  const searchWrap = document.getElementById('searchWrap');
  if (searchWrap) searchWrap.style.display = tab === 'tools' ? 'none' : 'block';
  const input = document.getElementById('searchInput');
  if (input) input.placeholder = tab === 'guides' ? 'Search guides…' : 'Search FAQs, keywords…';
}

// DEFAULT DATA
// ─────────────────────────────────────────────
function getDefaultData() {
  return { version:'1.0.0', categories:{ fusion:'Fusion', roster:'Roster', pay:'Pay & expenses', medical:'Medical', it:'IT & systems', general:'General' }, faqs:[], guides:[], quickLinks:[] };
}

init();
</script>
